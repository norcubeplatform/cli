# GoReleaser config for the Norcube CLI.
# https://goreleaser.com/customization/
#
# Triggered by `git push --tags` from .github/workflows/release.yaml.
# Releases go to https://github.com/norcubeplatform/cli/releases.
#
# Every optional step (macOS signing and notarization, Homebrew, Scoop,
# winget) switches itself off when its secret is not set, so a release
# without them still succeeds and ships unsigned archives. docs/RELEASING.md
# lists the secrets and how to create them.

version: 2
project_name: norcube

before:
  hooks:
    - go mod tidy
    # Shell completions (bash/zsh/fish) + man pages, shipped in every
    # archive and installed by the Homebrew formula.
    - go run ./tools/gendocs

builds:
  - id: norcube
    main: ./cmd/norcube
    binary: norcube
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X github.com/norcubeplatform/cli/internal/buildinfo.Version={{.Version}}
      - -X github.com/norcubeplatform/cli/internal/buildinfo.Commit={{.ShortCommit}}
      - -X github.com/norcubeplatform/cli/internal/buildinfo.Date={{.Date}}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      # Windows on arm64 is rare enough to skip until someone asks.
      - goos: windows
        goarch: arm64

archives:
  - id: norcube
    # Names align with what install.sh expects:
    #   norcube_<os>_<arch>.tar.gz   (or .zip on Windows)
    name_template: "norcube_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE*
      - NOTICE
      - completions/*
      - manpages/*

# Linux packages. They install the same files as the archives, in the
# places the distributions expect, plus the `nrc` alias that install.sh
# creates for archive installs.
nfpms:
  - id: norcube
    ids: [norcube]
    package_name: norcube
    formats: [deb, rpm, apk]
    vendor: Norcube
    homepage: https://norcube.com
    maintainer: Norcube <releases@norcube.com>
    description: Command-line interface for the Norcube platform
    license: Apache-2.0
    section: utils
    bindir: /usr/bin
    contents:
      - src: /usr/bin/norcube
        dst: /usr/bin/nrc
        type: symlink
      - src: ./completions/norcube.bash
        dst: /usr/share/bash-completion/completions/norcube
        file_info:
          mode: 0644
      - src: ./completions/norcube.fish
        dst: /usr/share/fish/vendor_completions.d/norcube.fish
        file_info:
          mode: 0644
      # Debian's zsh reads vendor completions from its own directory;
      # Fedora, openSUSE and Alpine use site-functions.
      - src: ./completions/_norcube
        dst: /usr/share/zsh/vendor-completions/_norcube
        packager: deb
        file_info:
          mode: 0644
      - src: ./completions/_norcube
        dst: /usr/share/zsh/site-functions/_norcube
        packager: rpm
        file_info:
          mode: 0644
      - src: ./completions/_norcube
        dst: /usr/share/zsh/site-functions/_norcube
        packager: apk
        file_info:
          mode: 0644
      - src: ./manpages/*.1
        dst: /usr/share/man/man1/
        file_info:
          mode: 0644
      - src: ./LICENSE
        dst: /usr/share/doc/norcube/LICENSE
        file_info:
          mode: 0644
      - src: ./NOTICE
        dst: /usr/share/doc/norcube/NOTICE
        file_info:
          mode: 0644

# One SPDX SBOM per archive (syft), uploaded next to it as
# <archive>.sbom.json.
sboms:
  - id: archives
    artifacts: archive

checksum:
  # GoReleaser emits a single checksums.txt with the SHA-256 of every
  # uploaded file (archives, packages, SBOMs). `norcube upgrade` and
  # install.sh verify against it before installing anything.
  name_template: "checksums.txt"
  algorithm: sha256

# Keyless Sigstore signature of checksums.txt, made with the release
# workflow's GitHub OIDC identity (no key to store or leak). The bundle
# holds the signature, the short-lived certificate and the transparency
# log entry; README.md shows how to verify it.
signs:
  - id: checksums
    cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "--yes"
      - "${artifact}"
    output: true

# Sign the macOS binaries with a Developer ID Application certificate and
# notarize them with Apple, using quill (works on the Linux runner). Runs
# only when the signing secrets are present; without the notary key it
# signs but does not notarize.
notarize:
  macos:
    - ids: [norcube]
      enabled: '{{ and (isEnvSet "MACOS_SIGN_P12") (isEnvSet "MACOS_SIGN_PASSWORD") }}'
      sign:
        # base64 of the .p12 export.
        certificate: '{{ envOrDefault "MACOS_SIGN_P12" "" }}'
        password: '{{ envOrDefault "MACOS_SIGN_PASSWORD" "" }}'
      notarize:
        issuer_id: '{{ envOrDefault "MACOS_NOTARY_ISSUER_ID" "" }}'
        key_id: '{{ envOrDefault "MACOS_NOTARY_KEY_ID" "" }}'
        # base64 of the App Store Connect API key (.p8).
        key: '{{ envOrDefault "MACOS_NOTARY_KEY" "" }}'
        wait: true
        # Apple usually answers within minutes, but a new team's first
        # submissions can take hours; the release waits rather than fails.
        timeout: 2h

snapshot:
  # Used when running `goreleaser release --snapshot` for testing — bumps
  # patch and appends -next so it doesn't collide with a real tag.
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "Merge pull request"
      - "Merge branch"

release:
  github:
    owner: norcubeplatform
    name: cli
  draft: false
  prerelease: auto

homebrew_casks:
  - name: norcube
    # Skipped (the cask is still rendered into dist/) until the token is set.
    skip_upload: '{{ if isEnvSet "HOMEBREW_TAP_TOKEN" }}false{{ else }}true{{ end }}'
    repository:
      owner: norcubeplatform
      name: homebrew-tap
      # The workflow's GITHUB_TOKEN can only write to this repository, so
      # the tap needs its own token (contents: write on the tap only).
      token: '{{ envOrDefault "HOMEBREW_TAP_TOKEN" "" }}'
    homepage: https://norcube.com
    description: Command-line interface for the Norcube platform
    binaries:
      - norcube
    # The short alias, as install.sh and the Linux packages provide it.
    custom_block: |
      binary "norcube", target: "nrc"
    completions:
      bash: completions/norcube.bash
      zsh: completions/_norcube
      fish: completions/norcube.fish
    commit_author:
      name: norcube-releases
      email: releases@norcube.com
    hooks:
      post:
        # Releases built without the macOS signing secrets are neither
        # signed nor notarized, so clear the quarantine attribute
        # Gatekeeper puts on downloaded files. Harmless on notarized
        # binaries.
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/norcube"]
          end

scoops:
  - name: norcube
    skip_upload: '{{ if isEnvSet "SCOOP_BUCKET_TOKEN" }}false{{ else }}true{{ end }}'
    repository:
      owner: norcubeplatform
      name: scoop-bucket
      token: '{{ envOrDefault "SCOOP_BUCKET_TOKEN" "" }}'
    directory: bucket
    homepage: https://norcube.com
    description: Command-line interface for the Norcube platform
    license: Apache-2.0
    commit_author:
      name: norcube-releases
      email: releases@norcube.com

# winget manifests go to microsoft/winget-pkgs as a pull request from a
# fork. Off until WINGET_TOKEN is set; the fork and the token are a
# one-time setup (docs/RELEASING.md).
winget:
  - name: norcube
    package_identifier: Norcube.CLI
    package_name: Norcube CLI
    publisher: Norcube
    publisher_url: https://norcube.com
    publisher_support_url: https://github.com/norcubeplatform/cli/issues
    author: Norcube
    homepage: https://norcube.com
    short_description: Command-line interface for the Norcube platform
    description: |
      norcube (alias nrc) manages Norcube products from the terminal and
      from CI: LangSync, Backup, DomainRadar, billing and your account.
    license: Apache-2.0
    license_url: https://github.com/norcubeplatform/cli/blob/main/LICENSE
    copyright: Copyright Norcube
    release_notes_url: "https://github.com/norcubeplatform/cli/releases/tag/{{ .Tag }}"
    tags: [cli, norcube, langsync, backup, domainradar]
    skip_upload: '{{ if isEnvSet "WINGET_TOKEN" }}false{{ else }}true{{ end }}'
    commit_author:
      name: norcube-releases
      email: releases@norcube.com
    repository:
      owner: norcubeplatform
      name: winget-pkgs
      branch: "norcube-{{ .Version }}"
      token: '{{ envOrDefault "WINGET_TOKEN" "" }}'
      pull_request:
        enabled: true
        base:
          owner: microsoft
          name: winget-pkgs
          branch: master
