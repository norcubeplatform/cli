# GoReleaser config for the Norcube CLI.
# https://goreleaser.com/customization/
#
# Triggered by `git push --tags` from .github/workflows/release.yaml.
# Releases go to https://github.com/norcubeplatform/cli/releases.

version: 2
project_name: norcube

before:
  hooks:
    - go mod tidy
    # Shell completions (bash/zsh/fish) + man pages, shipped in every
    # archive and installed by the Homebrew formula.
    - go run ./tools/gendocs

builds:
  - id: norcube
    main: ./cmd/norcube
    binary: norcube
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X github.com/norcubeplatform/cli/internal/buildinfo.Version={{.Version}}
      - -X github.com/norcubeplatform/cli/internal/buildinfo.Commit={{.ShortCommit}}
      - -X github.com/norcubeplatform/cli/internal/buildinfo.Date={{.Date}}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      # Windows on arm64 is rare enough to skip until someone asks.
      - goos: windows
        goarch: arm64

archives:
  - id: norcube
    # Names align with what install.sh expects:
    #   norcube_<os>_<arch>.tar.gz   (or .zip on Windows)
    name_template: "norcube_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE*
      - NOTICE
      - completions/*
      - manpages/*

checksum:
  # GoReleaser emits a single checksums.txt with SHA-256 for every archive.
  # `norcube upgrade` verifies against this file before swapping binaries.
  name_template: "checksums.txt"
  algorithm: sha256

snapshot:
  # Used when running `goreleaser release --snapshot` for testing — bumps
  # patch and appends -next so it doesn't collide with a real tag.
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "Merge pull request"
      - "Merge branch"

release:
  github:
    owner: norcubeplatform
    name: cli
  draft: false
  prerelease: auto

homebrew_casks:
  - name: norcube
    repository:
      owner: norcubeplatform
      name: homebrew-tap
      # A classic PAT with repo scope on the tap repository; the workflow's
      # default GITHUB_TOKEN can only write to the cli repo itself.
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://norcube.com
    description: Command-line interface for the Norcube platform
    binaries:
      - norcube
    completions:
      bash: completions/norcube.bash
      zsh: completions/_norcube
      fish: completions/norcube.fish
    commit_author:
      name: norcube-releases
      email: releases@norcube.com
    caveats: |
      The short alias `nrc` is not installed by Homebrew; add your own with
        ln -s "$(brew --prefix)/bin/norcube" "$(brew --prefix)/bin/nrc"
    hooks:
      post:
        # The binaries are not signed/notarized (yet), so clear the
        # quarantine attribute Gatekeeper puts on downloaded files.
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/norcube"]
          end
